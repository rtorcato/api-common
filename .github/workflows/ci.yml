name: CI

on:
  push:
    branches: [main, release, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:readme
      - run: pnpm check:docs
      - run: pnpm check:agents
      - run: pnpm build
      - run: pnpm size
      - run: pnpm check
      - run: pnpm typecheck
      # Package tests run in the test job's test:coverage; apps are outside its scope.
      - run: pnpm -r --filter "./apps/*" test
      - name: Validate package exports (publint + are-the-types-wrong)
        run: pnpm check:exports

  # Package tests on the engines floor and the newest Node.
  test:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]') }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:coverage

  # The single required check. Branch protection requires only `ci`, so adding a job or
  # changing the Node matrix never touches protection again. Skipped jobs pass ([skip ci]);
  # a failed or cancelled one fails the gate.
  ci:
    runs-on: ubuntu-latest
    needs: [checks, test]
    if: always()
    permissions: {}
    steps:
      - name: Every needed job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          [[ " $RESULTS " != *" failure "* && " $RESULTS " != *" cancelled "* ]]
