name: Release

# On demand only, never per merge: a dispatch (hotfix, ad hoc) or a closed
# milestone ("ship this batch"). Same shape as rtorcato/react-common.
on:
  workflow_dispatch:
  milestone:
    types: [closed]

# Queue rather than cancel: a newer run waits for the one ahead of it (approval
# included) instead of killing a publish already in flight.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Publish only from the default branch; a dispatch from any other branch is
    # skipped. The `release` environment adds a required-reviewer gate on top.
    if: github.event_name == 'milestone' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # Holds every run until a required reviewer approves it. The npm trusted
    # publishers must name this environment, or the OIDC publish fails with E404.
    environment: release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The tip, not the event's SHA: the job starts after approval, and
          # main may have moved on while it waited.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing needs npm CLI >= 11.5.1 (the .nvmrc Node 22 ships 10.x).
      # changeset publish -> pnpm publish delegates the upload to this npm.
      # pnpm must be >= 10.13 so it stops forwarding --no-git-checks down to
      # npm (npm now hard-errors on the unknown --git-checks flag); pinned via
      # packageManager in package.json. See pnpm#9646.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      # With pending changesets this opens or updates the "Version Packages" PR
      # and publishes nothing. Merging that PR publishes nothing either; the
      # next dispatch or milestone close (approved) publishes the bumped packages.
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: authenticates via OIDC trusted publishing (id-token: write
          # above). Requires a trusted publisher registered for THIS workflow file
          # (release.yml) on npmjs.com. Provenance is emitted automatically.
