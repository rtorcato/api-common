<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="786" viewBox="0 0 1280 786" role="img" aria-label="api-common — Framework-agnostic building blocks for Node.js APIs">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#0d1117"/>
			<stop offset="1" stop-color="#090c13"/>
		</linearGradient>
		<radialGradient id="glow" cx="0.12" cy="0.05" r="0.55">
			<stop offset="0" stop-color="#e879f9" stop-opacity="0.15"/>
			<stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="glow2" cx="0.95" cy="1" r="0.5">
			<stop offset="0" stop-color="#6e7bff" stop-opacity="0.12"/>
			<stop offset="1" stop-color="#6e7bff" stop-opacity="0"/>
		</radialGradient>
	</defs>

	<rect width="1280" height="786" fill="url(#bg)"/>
	<rect width="1280" height="786" fill="url(#glow)"/>
	<rect width="1280" height="786" fill="url(#glow2)"/>

	<!-- Logo mark: the favicon glyph (32 viewBox) scaled to 150px. -->
	<g transform="translate(565 104) scale(4.6875)">
		<rect width="32" height="32" rx="8" fill="#e879f9"/>
		<g fill="none" stroke="#0A0E16" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
			<path d="M13 9c-2.2 0-3 1.2-3 3v2.2c0 .9-.6 1.4-1.6 1.4v.8c1 0 1.6.5 1.6 1.4V21c0 1.8.8 3 3 3"/>
			<path d="M19 9c2.2 0 3 1.2 3 3v2.2c0 .9.6 1.4 1.6 1.4v.8c-1 0-1.6.5-1.6 1.4V21c0 1.8-.8 3-3 3"/>
		</g>
	</g>

	<text x="640" y="360" text-anchor="middle" font-family="Avenir Next" font-weight="800" font-size="76" letter-spacing="-1.8"><tspan fill="#e6edf3">api-</tspan><tspan fill="#e879f9">common</tspan></text>

	<text xml:space="preserve" x="640" y="432" text-anchor="middle" font-family="Menlo" font-weight="bold" font-size="22" letter-spacing="3"><tspan fill="#e6edf3">ERRORS</tspan><tspan fill="#5a6472"> · </tspan><tspan fill="#e879f9">AUTH</tspan><tspan fill="#5a6472"> · </tspan><tspan fill="#7ee787">RATE LIMIT</tspan></text>

	<!-- librsvg does not reset x on a y-only tspan, so every line repeats x. -->
	<text text-anchor="middle" font-family="Avenir Next" font-weight="500" font-size="30" fill="#9ba6b8">
		<tspan x="640" y="510">Framework-agnostic building blocks for Node.js</tspan>
		<tspan x="640" y="554">APIs — errors, auth, OpenAPI, Express + Hono.</tspan>
	</text>

	<rect x="427" y="608" width="426" height="78" rx="14" fill="#11151d" stroke="#232936" stroke-width="1"/>
	<text xml:space="preserve" x="640" y="656" text-anchor="middle" font-family="Menlo" font-size="24"><tspan fill="#e879f9">npm i </tspan><tspan fill="#e6edf3">@rtorcato/api-errors</tspan></text>
</svg>
