<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="api-common — Framework-agnostic building blocks for Node.js APIs">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#0d1117"/>
			<stop offset="1" stop-color="#090c13"/>
		</linearGradient>
		<radialGradient id="glow" cx="0.16" cy="0" r="0.55">
			<stop offset="0" stop-color="#e879f9" stop-opacity="0.15"/>
			<stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="glow2" cx="0.92" cy="1" r="0.5">
			<stop offset="0" stop-color="#6e7bff" stop-opacity="0.12"/>
			<stop offset="1" stop-color="#6e7bff" stop-opacity="0"/>
		</radialGradient>
	</defs>

	<rect width="1280" height="320" fill="url(#bg)"/>
	<rect width="1280" height="320" fill="url(#glow)"/>
	<rect width="1280" height="320" fill="url(#glow2)"/>

	<!-- Logo mark: the favicon glyph (32 viewBox) scaled to 72px. -->
	<g transform="translate(60 88) scale(2.25)">
		<rect width="32" height="32" rx="8" fill="#e879f9"/>
		<g fill="none" stroke="#0A0E16" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
			<path d="M13 9c-2.2 0-3 1.2-3 3v2.2c0 .9-.6 1.4-1.6 1.4v.8c1 0 1.6.5 1.6 1.4V21c0 1.8.8 3 3 3"/>
			<path d="M19 9c2.2 0 3 1.2 3 3v2.2c0 .9.6 1.4 1.6 1.4v.8c-1 0-1.6.5-1.6 1.4V21c0 1.8-.8 3-3 3"/>
		</g>
	</g>

	<text x="156" y="150" font-family="Avenir Next" font-weight="800" font-size="62" letter-spacing="-1.5"><tspan fill="#e6edf3">api-</tspan><tspan fill="#e879f9">common</tspan></text>

	<!-- librsvg does not reset x on a y-only tspan, so every line repeats x. -->
	<text font-family="Avenir Next" font-weight="500" font-size="20" fill="#9ba6b8">
		<tspan x="62" y="198">Framework-agnostic building blocks for Node.js APIs —</tspan>
		<tspan x="62" y="226">errors, auth, rate limiting, OpenAPI, Express + Hono.</tspan>
	</text>

	<!-- Code panel -->
	<rect x="845" y="58" width="378" height="204" rx="14" fill="#11151d" stroke="#232936" stroke-width="1"/>
	<g font-family="Menlo" font-size="14">
		<text xml:space="preserve" x="869" y="94"><tspan fill="#e879f9">import</tspan><tspan fill="#e6edf3"> { NotFoundError }</tspan></text>
		<text xml:space="preserve" x="869" y="116"><tspan fill="#e879f9">from</tspan><tspan fill="#7ee787"> '@rtorcato/api-errors'</tspan></text>

		<text xml:space="preserve" x="869" y="160"><tspan fill="#e879f9">throw new</tspan><tspan fill="#e6edf3"> NotFoundError()</tspan></text>
		<text xml:space="preserve" x="869" y="182" fill="#7d8899">// → 404 { "error": "Not Found" }</text>

		<text xml:space="preserve" x="869" y="226"><tspan fill="#7ee787">✓</tspan><tspan fill="#7d8899">  Express + Hono middleware</tspan></text>
	</g>
</svg>
