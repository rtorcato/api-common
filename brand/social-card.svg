<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="api-common — Framework-agnostic building blocks for Node.js APIs">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#0d1117"/>
			<stop offset="1" stop-color="#090c13"/>
		</linearGradient>
		<radialGradient id="glow" cx="0.1" cy="0.05" r="0.55">
			<stop offset="0" stop-color="#e879f9" stop-opacity="0.15"/>
			<stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="glow2" cx="0.95" cy="1" r="0.5">
			<stop offset="0" stop-color="#6e7bff" stop-opacity="0.12"/>
			<stop offset="1" stop-color="#6e7bff" stop-opacity="0"/>
		</radialGradient>
	</defs>

	<rect width="1280" height="640" fill="url(#bg)"/>
	<rect width="1280" height="640" fill="url(#glow)"/>
	<rect width="1280" height="640" fill="url(#glow2)"/>

	<!-- Logo mark: the favicon glyph (32 viewBox) scaled to 100px. -->
	<g transform="translate(64 176) scale(3.125)">
		<rect width="32" height="32" rx="8" fill="#e879f9"/>
		<g fill="none" stroke="#0A0E16" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
			<path d="M13 9c-2.2 0-3 1.2-3 3v2.2c0 .9-.6 1.4-1.6 1.4v.8c1 0 1.6.5 1.6 1.4V21c0 1.8.8 3 3 3"/>
			<path d="M19 9c2.2 0 3 1.2 3 3v2.2c0 .9.6 1.4 1.6 1.4v.8c-1 0-1.6.5-1.6 1.4V21c0 1.8-.8 3-3 3"/>
		</g>
	</g>

	<text x="188" y="250" font-family="Avenir Next" font-weight="800" font-size="64" letter-spacing="-1.5"><tspan fill="#e6edf3">api-</tspan><tspan fill="#e879f9">common</tspan></text>

	<text xml:space="preserve" x="66" y="318" font-family="Menlo" font-weight="bold" font-size="18" letter-spacing="3"><tspan fill="#e6edf3">ERRORS</tspan><tspan fill="#5a6472"> · </tspan><tspan fill="#e879f9">AUTH</tspan><tspan fill="#5a6472"> · </tspan><tspan fill="#7ee787">RATE LIMIT</tspan></text>

	<!-- librsvg does not reset x on a y-only tspan, so every line repeats x. -->
	<text font-family="Avenir Next" font-weight="500" font-size="27" fill="#9ba6b8">
		<tspan x="66" y="384">Framework-agnostic building blocks</tspan>
		<tspan x="66" y="422">for Node.js APIs — errors, auth,</tspan>
		<tspan x="66" y="460">rate limiting, OpenAPI, Express + Hono.</tspan>
	</text>

	<!-- Editor panel -->
	<rect x="650" y="140" width="574" height="360" rx="14" fill="#11151d" stroke="#232936" stroke-width="1"/>
	<path d="M650 154a14 14 0 0 1 14-14h546a14 14 0 0 1 14 14v34H650z" fill="#171c26"/>
	<circle cx="673" cy="164" r="6" fill="#ff5f57"/>
	<circle cx="694" cy="164" r="6" fill="#febc2e"/>
	<circle cx="715" cy="164" r="6" fill="#28c840"/>
	<text xml:space="preserve" x="742" y="170" font-family="Menlo" font-size="15" fill="#7d8899">app.ts</text>

	<g font-family="Menlo" font-size="19">
		<text xml:space="preserve" x="674" y="234"><tspan fill="#e879f9">import</tspan><tspan fill="#e6edf3"> { NotFoundError }</tspan></text>
		<text xml:space="preserve" x="674" y="262"><tspan fill="#e879f9">from</tspan><tspan fill="#7ee787"> '@rtorcato/api-errors'</tspan></text>

		<text xml:space="preserve" x="674" y="318"><tspan fill="#e879f9">throw new</tspan><tspan fill="#e6edf3"> NotFoundError(</tspan><tspan fill="#7ee787">'user'</tspan><tspan fill="#e6edf3">)</tspan></text>
		<text xml:space="preserve" x="674" y="346" fill="#7d8899">// → 404 Not Found</text>

		<text xml:space="preserve" x="674" y="402"><tspan fill="#e6edf3">app.use(errorHandler())</tspan></text>
		<text xml:space="preserve" x="674" y="430" fill="#7d8899">// Express or Hono</text>

		<text xml:space="preserve" x="674" y="470"><tspan fill="#7ee787">✓</tspan><tspan fill="#7d8899">  framework-agnostic core</tspan></text>
	</g>
</svg>
